name: CI

on:
  push:
    branches:
      - dev
      - auto/clang-tidy
  pull_request:

jobs:

  build_navitia_ci:
    runs-on: [self-hosted, corefront, sandbox]
    container:
      image: python:3.11-bullseye

    env:
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content

    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672

      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379

    steps:
    - name: Force chown to avoid errors
      run: chown -R $(whoami):$(whoami) .

    - name: Generate github private access token
      id: ci-core-app-token
      uses: getsentry/action-github-app-token@v2.0.0
      with:
        app_id: ${{ secrets.CI_CORE_APP_ID }}
        private_key: ${{ secrets.CI_CORE_APP_PEM }}

    - name: Install git
      run: |
        apt clean
        rm -rf /var/lib/apt/lists/*
        echo "deb [check-valid-until=no] http://archive.debian.org/debian/ bullseye main" > /etc/apt/sources.list
        echo "deb [check-valid-until=no] http://archive.debian.org/debian/ bullseye-updates main" >> /etc/apt/sources.list
        echo "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260903T000000Z bullseye-security main" >> /etc/apt/sources.list
        apt-get -o Acquire::Check-Valid-Until=false update -y
        apt install -o Acquire::Retries=10 git -y

    - uses: actions/checkout@v3
      with:
        submodules: recursive
        token: ${{ steps.ci-core-app-token.outputs.token }}
        # 'check_submodules.sh' below needs entire history
        fetch-depth: 0

    - name: Install navitia dependencies
      run: ./scripts/navitia_dependencies.sh

    - name: Check submodule
      run: ./source/scripts/check_submodules.sh

    - name: Config github global url for ssh cases (add access token)
      run: |
        git config --global url."https://x-access-token:${{ steps.ci-core-app-token.outputs.token }}@github.com/hove-io/".insteadOf "git@github.com:hove-io/"

    - name: Install pre-commit requirements
      run: |
        pip3 install -r requirements_pre-commit.txt --upgrade

    - name: Build protobuf
      run: bash source/scripts/build_protobuf.sh

    - name: Build pre-commit
      env:
        LC_ALL: C.UTF-8
        LANG: C.UTF-8
      run: |
        pre-commit install --install-hooks
        pre-commit run --all --show-diff-on-failure

    - name: ccache cache (shared across runners)
      uses: actions/cache@v4
      with:
        path: /ccache
        key: ccache-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.ref_name }}-
          ccache-

    - name: Configure for release
      run: mkdir build && cd ./build && cmake -DSTRIP_SYMBOLS=ON ../source

    - name: Build navitia
      working-directory: ./build
      run: make -j $(nproc)

    - name: ccache stats
      if: ${{ always() }}
      run: ccache -s

    - name: Tests python3
      working-directory: ./build
      run: |
        virtualenv -p  python navitia_py3
        . navitia_py3/bin/activate
        pip install -r ../source/jormungandr/requirements_dev.txt
        export JORMUNGANDR_BROKER_URL='amqp://guest:guest@rabbitmq:5672//'
        export KRAKEN_RABBITMQ_HOST='rabbitmq'
        ctest --output-on-failure
        deactivate
        rm -rf navitia_py3

    - name: Docker test python3
      working-directory: ./build
      run: |
        virtualenv -p python navitia_py3
        . navitia_py3/bin/activate
        pip install -r ../source/tyr/requirements_dev.txt
        pip install -r ../source/sql/requirements.txt
        export NAVITIA_CHAOS_DUMP_PATH=$(echo $GITHUB_WORKSPACE/source/tests/chaos/chaos_loading.sql.gz | sed -e 's#__w#/opt/actions-runner/_work#')
        make docker_test
        deactivate
        rm -rf navitia_py3

      env:
        NAVITIA_DOCKER_NETWORK: ${{ job.container.network }}
        TYR_CELERY_BROKER_URL: 'amqp://guest:guest@rabbitmq:5672//'
        TYR_REDIS_HOST: 'redis'

    - name: Clean up workspace
      if: ${{ always() }}
      run: |
        rm -rf ./*
        rm -rf ./.??*
