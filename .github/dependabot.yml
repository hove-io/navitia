# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/source/cities"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
         - "*"
  - package-ecosystem: "pip"
    directory: "/source/sql"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
         - "*"
  - package-ecosystem: "pip"
    directory: "/source/tyr"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
         - "*"
  - package-ecosystem: "pip"
    directory: "/source/jormungandr"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
         - "*"
  - package-ecosystem: "pip"
    directory: "/source/monitor"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
         - "*"
  - package-ecosystem: "pip"
    directory: "/source/eitri"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
         - "*"
  - package-ecosystem: "pip"
    directory: "/source/benchmark"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
         - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github_actions:
        patterns:
         - "*"

